<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">ConsensusAlign overview</title>
  <desc id="desc">Frozen vision and text encoders share rows within each modality. The two fitting sets are unpaired. Concatenation and PCA produce two pooled spaces, one Wasserstein Procrustes fit connects them, and closed-form native factors yield a map for any encoder pair.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b" /></marker>
    </defs>
  <rect x="0" y="0" width="1200" height="440" rx="16" fill="#fff" />
  <text x="40" y="37" font-size="22" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#172033">Pool once. Fit one bridge. Deploy any encoder pair.</text>
  <rect x="35" y="70" width="292" height="133" rx="12" fill="#eef6ff" stroke="#b6d4f6" />
  <text x="53" y="102" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="20" font-weight="600">Vision encoder collection</text>
  <rect x="54" y="120" width="72" height="35" rx="6" fill="#d3e6fc" />
  <rect x="143" y="120" width="72" height="35" rx="6" fill="#d3e6fc" />
  <rect x="232" y="120" width="72" height="35" rx="6" fill="#d3e6fc" />
  <text x="90" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="17">V₁</text>
  <text x="179" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="17">V₂</text>
  <text x="268" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="17">Vₘ</text>
  <text x="53" y="183" font-family="Arial, Helvetica, sans-serif" fill="#526176" font-size="15">Same images, frozen encoders</text>
  <rect x="35" y="229" width="292" height="133" rx="12" fill="#fff4eb" stroke="#edc9a8" />
  <text x="53" y="261" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="20" font-weight="600">Text encoder collection</text>
  <rect x="54" y="279" width="72" height="35" rx="6" fill="#f9dfc7" />
  <rect x="143" y="279" width="72" height="35" rx="6" fill="#f9dfc7" />
  <rect x="232" y="279" width="72" height="35" rx="6" fill="#f9dfc7" />
  <text x="90" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="17">T₁</text>
  <text x="179" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="17">T₂</text>
  <text x="268" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="17">Tₙ</text>
  <text x="53" y="342" font-family="Arial, Helvetica, sans-serif" fill="#526176" font-size="15">Same texts, frozen encoders</text>
  <path d="M327 137H376" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M327 296H376" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="383" y="96" width="207" height="83" rx="10" fill="#eef6ff" stroke="#b6d4f6" />
  <rect x="383" y="255" width="207" height="83" rx="10" fill="#fff4eb" stroke="#edc9a8" />
  <text x="487" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="20" font-weight="600">Concat + PCA</text>
  <text x="487" y="157" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="17">Vision pool</text>
  <text x="487" y="289" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="20" font-weight="600">Concat + PCA</text>
  <text x="487" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="17">Text pool</text>
  <path d="M590 137H625Q642 137 642 155V179" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M590 296H625Q642 296 642 278V254" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="609" y="185" width="176" height="63" rx="10" fill="#f1effc" stroke="#c9bff1" />
  <text x="697" y="211" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="20" font-weight="600">One WP fit</text>
  <text x="697" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="17">Bridge C</text>
  <text x="697" y="339" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#526176" font-size="15">Unpaired fitting sets</text>
  <path d="M785 217H838" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="846" y="122" width="316" height="190" rx="12" fill="#f6f8fb" stroke="#cbd5e1" />
  <text x="1004" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="20" font-weight="600">Native encoder maps</text>
  <text x="1004" y="204" font-size="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033">Wᵢⱼ = Qᵢ C Rⱼᵀ</text>
  <text x="1004" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="17">Closed-form factors</text>
  <text x="1004" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#172033" font-size="17">Two encoders at inference</text>
  <path d="M53 390H1145" stroke="#e2e8f0" />
  <text x="600" y="418" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#526176" font-size="15">Known correspondence within a modality · No image–text pairs for the base fit · Optional paired anchors</text>
</svg>

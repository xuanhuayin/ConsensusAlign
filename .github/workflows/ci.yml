name: Tests and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU runtime and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run tests
        env:
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Exercise the installed wheel outside the checkout
        shell: bash
        run: |
          python -m pip uninstall -y consensusalign
          python -m pip install --no-deps dist/*.whl
          project_dir="$PWD"
          run_dir="$(mktemp -d)"
          cd "$run_dir"
          python "$project_dir/examples/smoke.py" --output smoke
          consensusalign --help
